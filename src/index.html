<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi セッション履歴</title><style>
:root{color-scheme:light dark;--bg:#fafafa;--fg:#1d1f23;--mut:#6b7280;--card:#fff;--bd:#d9dce1;--ac:#2563eb;--acbg:#dbeafe;--ac2:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e5e7eb;--mut:#9aa3b2;--card:#1c1f25;--bd:#333943;--ac:#6ea0ff;--acbg:#1e3a6e;--ac2:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
header{padding:12px 20px;border-bottom:1px solid var(--bd);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0}
#gen{color:var(--mut);font-size:12px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:20px;padding:16px 20px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
.side{position:sticky;top:12px}
@media (max-width:820px){.side{position:static}}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input[type=search],select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
input[type=search]{flex:1 1 240px;min-width:0}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--ac)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.calhead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
#monthLabel{flex:1;text-align:center;font-weight:600}
#cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center;color:var(--mut);font-size:12px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0;min-height:44px;border-radius:6px;position:relative;background:color-mix(in srgb,var(--ac) calc(var(--a,0)*100%),var(--card))}
.day.zero{color:var(--mut);opacity:.6}
.day .n{font-size:13px}
.day .c{font-size:10px;color:var(--mut);min-height:12px}
.day.today{border-color:var(--ac);border-width:2px}
.day.sel{background:var(--ac);color:#fff;border-color:var(--ac);opacity:1}
.day.sel .c{color:#fff}
.calfoot{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--acbg);border-radius:999px;padding:2px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 2px}
#summary{color:var(--mut);margin:0 0 6px}
.grp{margin:18px 0 6px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--bd);padding-bottom:2px}
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd)}
.row:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.rowlink{flex:1;min-width:0;display:grid;grid-template-columns:130px 150px minmax(0,1fr) 56px 64px 150px;gap:8px;padding:6px 4px;color:inherit;text-decoration:none;align-items:baseline}
@media (max-width:1100px){.rowlink{grid-template-columns:120px minmax(0,1fr) 56px 64px}.rowlink .p,.rowlink .mo{display:none}}
.rowlink>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t,.m,.co{font-variant-numeric:tabular-nums}
.m,.co{text-align:right}
.p,.mo,.fp{color:var(--mut)}
.ti{display:flex;flex-direction:column;min-width:0}
.ti>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt{font-weight:600}
.fp{font-size:12px}
.act{display:flex;gap:4px}
.act button{font-size:12px;padding:2px 6px;white-space:nowrap}
.more{display:block;margin:16px auto}
.empty{color:var(--mut);padding:24px 0;text-align:center}
.spend{margin:0 0 12px;padding:8px 12px}
.spend>summary{cursor:pointer;font-weight:600}
.spend>summary .sc{font-weight:400;color:var(--mut);font-size:12px;margin-left:8px}
.sptot{display:flex;flex-wrap:wrap;gap:4px 18px;margin:8px 0;align-items:baseline}
.sptot .big{font-size:20px;font-weight:700}
.sptot span{white-space:nowrap}
.sptot .k{color:var(--mut);font-size:12px;margin-right:4px}
[hidden]{display:none!important}
.spgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:10px;align-items:start}
@media (min-width:1150px){.spgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}}
.sptbl{overflow:auto;max-height:300px;margin-top:10px}
table.sp thead th{position:sticky;top:0;background:var(--card)}
table.sp{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.sp th,table.sp td{padding:3px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
table.sp th{color:var(--mut);font-weight:400;font-size:12px}
table.sp .l{text-align:left}
table.sp tr.pj{cursor:pointer}
table.sp tr.pj:hover{background:color-mix(in srgb,var(--ac) 8%,transparent)}
table.sp tr.md td{color:var(--mut);font-size:13px}
table.sp tr.md td.l{padding-left:28px}
table.sp .lk{border:0;background:none;padding:0;text-align:left;font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.sp .lk:hover{text-decoration:underline}
table.sp .tg{border:0;background:none;padding:0 4px;color:var(--mut)}
table.sp .tg[aria-expanded=true]{transform:rotate(90deg)}
.bar{display:inline-block;width:80px;height:8px;background:color-mix(in srgb,var(--ac) 15%,transparent);border-radius:4px;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ac)}
.spnote{color:var(--mut);font-size:12px;margin:6px 0 0}
.spchart{margin-top:6px}
.spchart svg{display:block;width:100%;height:110px;background:color-mix(in srgb,var(--ac) 4%,transparent);border-radius:4px}
.spchart .hit{fill:transparent}
.spchart .hit:hover{fill:color-mix(in srgb,var(--ac) 14%,transparent)}
.spchart .b{fill:var(--ac);pointer-events:none}
.spchart .bs{fill:var(--ac2);pointer-events:none}
.spaxis{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.spaxis .mx{order:-1}
.cachep{--cdrop:#e0556b;--crc:#3b82f6;--cttl:#d97706;--cmod:#8b5cf6;--coth:#8a93a3}
.cachep .cchart{margin-top:4px}
.cachep h4{margin:0;font-size:13px;font-weight:600}
.cachep .cleg{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:12px;margin:2px 0}
.cachep .cleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cachep svg{display:block;width:100%;height:90px;background:color-mix(in srgb,var(--ac) 4%,transparent);border-radius:4px}
.cachep svg .hit{fill:transparent}
.cachep svg .hit:hover{fill:color-mix(in srgb,var(--ac) 14%,transparent)}
.cachep svg rect:not(.hit){pointer-events:none}
.cachep .k-drop{fill:var(--cdrop)}.cachep .k-rc{fill:var(--crc)}.cachep .k-ttl{fill:var(--cttl)}.cachep .k-mod{fill:var(--cmod)}.cachep .k-oth{fill:var(--coth)}
.cachep .cleg .k-drop{background:var(--cdrop)}.cachep .cleg .k-rc{background:var(--crc)}.cachep .cleg .k-ttl{background:var(--cttl)}.cachep .cleg .k-mod{background:var(--cmod)}.cachep .cleg .k-oth{background:var(--coth)}
.cachep .sptot .sub{color:var(--mut);font-size:12px}
.cachep .badge{font-size:11px;border:1px solid var(--bd);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--mut)}
.cachep .bar i{background:var(--crc)}
.cachep .cmore{display:block;margin:8px auto 0}
.cachep{--cpos:#15803d;--cneg:#c8283f}
@media (prefers-color-scheme:dark){.cachep{--cpos:#4ade80;--cneg:#f87171}}
.cachep .pos{color:var(--cpos)}.cachep .neg{color:var(--cneg)}
.cachep .sptot.small .big{font-size:15px}
.cachep .livegrp{display:flex;flex-wrap:wrap;gap:0 24px;align-items:baseline}
.cachep .sptot.live{flex-basis:100%;border-left:3px solid var(--cpos);padding-left:10px}
.cachep .sptot.live .big{font-size:26px}
.cachep .livetg{display:flex;gap:6px;margin:8px 0}
.cachep .livebtn{font:inherit;font-size:12px;border:1px solid var(--bd);border-radius:999px;padding:1px 10px;background:transparent;color:var(--mut);cursor:pointer}
.cachep .livebtn.on{border-color:var(--ac);color:inherit}
.cachep .badge.pos{border-color:var(--cpos)}.cachep .badge.neg{border-color:var(--cneg)}
.cachep svg .k-pos{fill:var(--cpos)}.cachep svg .k-neg{fill:var(--cneg)}
.cachep svg .zero{stroke:var(--mut);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.5}
.cachep .cleg .k-pos{background:var(--cpos)}.cachep .cleg .k-neg{background:var(--cneg)}
.cachep th[title]{cursor:help}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:.92}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head>
<body>
<header><h1>Pi セッション履歴</h1><span id="gen"></span></header>
<div class="layout">
<aside class="side panel" aria-label="カレンダー">
<div class="calhead"><button type="button" id="prev" aria-label="前の月">‹</button><span id="monthLabel" aria-live="polite"></span><button type="button" id="next" aria-label="次の月">›</button><button type="button" id="todayBtn">今月</button></div>
<div id="cal" role="group" aria-label="開始日で絞り込み"></div>
<div class="calfoot"><button type="button" id="clearDate" disabled>絞り込み解除</button></div>
</aside>
<main>
<div class="controls">
<input type="search" id="q" placeholder="検索（スペース区切りでAND）" aria-label="検索">
<select id="project" aria-label="プロジェクト"></select>
<select id="sort" aria-label="並び替え"><option value="new">新しい順</option><option value="old">古い順</option><option value="cost">コスト順</option><option value="msgs">メッセージ数順</option></select>
</div>
<div class="controls"><span id="range" class="chip" hidden><span id="rangeText"></span></span><span id="projChip" class="chip" hidden><span id="projChipText"></span><button type="button" id="projChipClear" aria-label="プロジェクト絞り込みを解除">×</button></span></div>
<details id="spend" class="spend panel" open><summary>期間の支出<span id="spendScope" class="sc"></span></summary><div id="spendBody"></div></details>
<details id="cachep" class="spend cachep panel" open><summary>キャッシュ（miss / relay）<span id="cachepScope" class="sc"></span></summary><div id="cachepBody"></div></details>
<p id="summary" aria-live="polite">読み込み中…</p>
<div id="list"></div>
</main>
</div>
<div id="toast" role="status"></div>
<script>
function pad2(n){return n<10?"0"+n:""+n}
function dateKey(ms){var d=new Date(ms);if(isNaN(d.getTime()))return "";return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function inRange(key,start,end){
  if(!start)return true;
  var lo=start,hi=end||start;
  if(lo>hi){var t=lo;lo=hi;hi=t}
  return key>=lo&&key<=hi;
}
function tokenize(q){return String(q).toLowerCase().split(/\s+/).filter(Boolean)}
function haystack(e){return [e.title,e.firstPrompt,e.searchText,e.project,e.cwd].join("\n").toLowerCase()}
function matchTokens(hay,tokens){for(var i=0;i<tokens.length;i++){if(hay.indexOf(tokens[i])<0)return false}return true}
function rangeLabel(sel){
  if(!sel)return "";
  return sel.start===sel.end?sel.start:sel.start+"〜"+sel.end;
}
function nextSelection(sel,key,shift){
  if(shift&&sel&&sel.anchor){
    var a=sel.anchor,lo=a<key?a:key,hi=a<key?key:a;
    return {anchor:a,start:lo,end:hi};
  }
  if(!sel)return {anchor:key,start:key,end:key};
  if(sel.start===sel.end){
    if(key===sel.start)return null;
    var l=sel.start<key?sel.start:key,h=sel.start<key?key:sel.start;
    return {anchor:sel.start,start:l,end:h};
  }
  return {anchor:key,start:key,end:key};
}
function monthCells(y,m){
  return {lead:new Date(y,m,1).getDay(),days:new Date(y,m+1,0).getDate()};
}
function sortEntries(list,mode){
  var a=list.slice();
  if(mode==="old")a.sort(function(x,y){return x._ms-y._ms});
  else if(mode==="cost")a.sort(function(x,y){return (y.cost||0)-(x.cost||0)||y._ms-x._ms});
  else if(mode==="msgs")a.sort(function(x,y){return (y.messages||0)-(x.messages||0)||y._ms-x._ms});
  else a.sort(function(x,y){return y._ms-x._ms});
  return a;
}
function fmtMoney(c){
  var v=Number(c)||0,neg=v<0;if(neg)v=-v;
  var p=v.toFixed(2).split("."),ip=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"-":"")+"$"+ip+"."+p[1];
}
function fmtTok(n){
  n=Number(n)||0;
  if(n>=999500)return (n/1e6).toFixed(1)+"M";
  if(n>=1e4)return Math.round(n/1e3)+"k";
  if(n>=1e3)return (n/1e3).toFixed(1)+"k";
  return String(Math.round(n));
}
function dateKeysBetween(lo,hi){
  var out=[];if(!lo||!hi||lo>hi)return out;
  var p=lo.split("-");
  for(var i=0;i<3700;i++){
    var k=dateKey(new Date(+p[0],+p[1]-1,+p[2]+i).getTime());
    out.push(k);if(k>=hi)break;
  }
  return out;
}
function spendZero(){return {cost:0,input:0,output:0,cacheRead:0,cacheWrite:0,messages:0,subCost:0}}
function spendAdd(t,r){
  t.cost+=r.cost||0;t.input+=r.input||0;t.output+=r.output||0;t.cacheRead+=r.cacheRead||0;t.cacheWrite+=r.cacheWrite||0;t.messages+=r.messages||0;
  if(r.sub)t.subCost+=r.cost||0;
}
// Pure: rows = /api/index `spend`, sel = {start,end}|null (local dates), projOk = function(project)->bool.
// The search text never applies here. Returns totals, per project (with per model), per model and per day.
function aggregateSpend(rows,sel,projOk){
  var total=spendZero(),pj={},md={},days={};
  for(var i=0;i<(rows||[]).length;i++){
    var r=rows[i];
    if(sel&&!inRange(r.date,sel.start,sel.end))continue;
    if(projOk&&!projOk(r.project))continue;
    spendAdd(total,r);
    var p=pj[r.project]||(pj[r.project]=Object.assign(spendZero(),{project:r.project,models:{}}));
    spendAdd(p,r);
    spendAdd(p.models[r.model]||(p.models[r.model]=Object.assign(spendZero(),{model:r.model})),r);
    spendAdd(md[r.model]||(md[r.model]=Object.assign(spendZero(),{model:r.model})),r);
    if(r.date)spendAdd(days[r.date]||(days[r.date]=spendZero()),r);
  }
  var byCost=function(a,b){return (b.cost-a.cost)||((a.project||a.model||"")<(b.project||b.model||"")?-1:1)};
  var projects=Object.keys(pj).map(function(k){var p=pj[k];p.models=Object.keys(p.models).map(function(m){return p.models[m]}).sort(byCost);return p}).sort(byCost);
  var models=Object.keys(md).map(function(k){return md[k]}).sort(byCost);
  return {total:total,projects:projects,models:models,days:days};
}
// Pure: chart data for each day of the range (selection, else first..last day with data).
function spendDays(agg,sel){
  var keys=Object.keys(agg.days).sort(),lo,hi;
  if(sel){lo=sel.start;hi=sel.end||sel.start;if(lo>hi){var t=lo;lo=hi;hi=t}}
  else if(keys.length){lo=keys[0];hi=keys[keys.length-1]}
  return dateKeysBetween(lo,hi).map(function(k){var d=agg.days[k];return {date:k,cost:d?d.cost:0,subCost:d?d.subCost:0}});
}
function cacheZero(){return {misses:0,missTokens:0,missCost:0,missTtl:0,missTtlTokens:0,missModel:0,missModelTokens:0,
  relays:0,relayBefore:0,relayAfter:0,relayDropped:0,relayRecache:0,relayRecacheCost:0,relayPostRequests:0,relaySavings:0,
  relayLive:0,relayLiveRecacheCost:0,relayLiveSavings:0,relayLivePostRequests:0,
  compacts:0,compactBefore:0,compactAfter:0,compactDropped:0,compactRecache:0,compactRecacheCost:0,compactPostRequests:0,compactSavings:0,
  compactLive:0,compactLiveRecacheCost:0,compactLiveSavings:0,compactLivePostRequests:0}}
var CACHE_KEYS=Object.keys(cacheZero());
// Pure: rows = /api/index `cache` (may be undefined), sel/projOk as aggregateSpend. Search text never applies.
// Returns totals and per-day sums (days[date] has the totals shape).
function aggregateCache(rows,sel,projOk){
  var total=cacheZero(),days={};
  for(var i=0;i<(rows||[]).length;i++){
    var r=rows[i];
    if(sel&&!inRange(r.date,sel.start,sel.end))continue;
    if(projOk&&!projOk(r.project))continue;
    var d=r.date?(days[r.date]||(days[r.date]=cacheZero())):null;
    for(var k=0;k<CACHE_KEYS.length;k++){var key=CACHE_KEYS[k],v=Number(r[key])||0;total[key]+=v;if(d)d[key]+=v}
  }
  return {total:total,days:days};
}
// Pure: chart data for each day of the range (selection, else first..last day with data); same range logic as spendDays.
function cacheDays(agg,sel){
  var keys=Object.keys(agg.days).sort(),lo,hi;
  if(sel){lo=sel.start;hi=sel.end||sel.start;if(lo>hi){var t=lo;lo=hi;hi=t}}
  else if(keys.length){lo=keys[0];hi=keys[keys.length-1]}
  return dateKeysBetween(lo,hi).map(function(k){
    var d=agg.days[k]||cacheZero();
    var ttl=d.missTtlTokens,mod=d.missModelTokens,oth=Math.max(0,d.missTokens-ttl-mod);
    return {date:k,dropped:d.relayDropped+d.compactDropped,recache:d.relayRecache+d.compactRecache,
      recacheCost:d.relayRecacheCost+d.compactRecacheCost,events:d.relays+d.compacts,
      relaySavings:d.relaySavings,relayCost:d.relayRecacheCost,relayNet:d.relaySavings-d.relayRecacheCost,relays:d.relays,
      misses:d.misses,missTokens:d.missTokens,missCost:d.missCost,missTtl:ttl,missModel:mod,missOther:oth};
  });
}
// Pure: events newest first, filtered by inRange(date) and projOk (never by search text).
function filterCacheEvents(events,sel,projOk){
  var out=(events||[]).filter(function(e){
    if(sel&&!inRange(e.date,sel.start,sel.end))return false;
    if(projOk&&!projOk(e.project))return false;
    return true;
  });
  out.sort(function(a,b){return a.ts<b.ts?1:a.ts>b.ts?-1:0});
  return out;
}
// Pure: events by cache liveness. mode "all" (default) / "live" (e.live===true) / "dead" (otherwise). Missing `live` counts as dead.
function filterCacheLive(events,mode){
  if(mode!=="live"&&mode!=="dead")return events||[];
  return (events||[]).filter(function(e){return (e.live===true)===(mode==="live")});
}
// Pure: live / dead split of relay or compaction. t = aggregateCache total, evs = filtered events, kind = "relay"|"compact".
// Counts and $ come from the aggregate (dead = total - live); profit (net>=0) comes from events.
function cacheLiveSplit(t,evs,kind){
  var p=kind==="relay"?"relay":"compact",n=kind==="relay"?t.relays:t.compacts;
  var live={count:t[p+"Live"],savings:t[p+"LiveSavings"],cost:t[p+"LiveRecacheCost"],post:t[p+"LivePostRequests"],profit:0};
  var dead={count:Math.max(0,n-live.count),savings:t[p+"Savings"]-live.savings,cost:t[p+"RecacheCost"]-live.cost,post:t[p+"PostRequests"]-live.post,profit:0};
  (evs||[]).forEach(function(e){
    if(e.kind!==kind||typeof e.net!=="number"||e.net<0)return;
    (e.live===true?live:dead).profit++;
  });
  live.net=live.savings-live.cost;dead.net=dead.savings-dead.cost;
  return {live:live,dead:dead};
}
// Pure: relay events by trigger (manual/input/expiry/unknown).
function cacheTriggerCounts(events){
  var c={manual:0,input:0,expiry:0,unknown:0};
  (events||[]).forEach(function(e){if(e.kind!=="relay")return;if(e.trigger==="manual"||e.trigger==="input"||e.trigger==="expiry")c[e.trigger]++;else c.unknown++});
  return c;
}
// Pure: relay events by trigger -> {count, profit (net>=0 count), net (sum of net USD)}. Events without a numeric `net` count but not as profit and add 0.
function cacheNetByTrigger(events){
  var c={manual:{count:0,profit:0,net:0},input:{count:0,profit:0,net:0},expiry:{count:0,profit:0,net:0},unknown:{count:0,profit:0,net:0}};
  (events||[]).forEach(function(e){
    if(e.kind!=="relay")return;
    var b=c[e.trigger==="manual"||e.trigger==="input"||e.trigger==="expiry"?e.trigger:"unknown"];
    b.count++;
    if(typeof e.net==="number"){b.net+=e.net;if(e.net>=0)b.profit++}
  });
  return c;

    function liveCard(label,x,cls,title){
      var c=!hasNet?"":x.net>=0?"pos":"neg";
      return "<div class=\"sptot "+cls+"\"><span class=\"big "+c+"\" title=\""+title+"\">"+(hasNet?fmtNet(x.net):"–")+"<span class=\"k\">"+label+"</span></span>"
        +cacheKv("件数",String(x.count))+cacheKv("節約",hasNet?fmtMoney(x.savings):"–")+cacheKv("再書込",fmtMoney(x.cost))+cacheKv("黒字",x.profit+"件")+"</div>";
    }
    var rs=cacheLiveSplit(t,evsAll,"relay"),cs=cacheLiveSplit(t,evsAll,"compact");
    h+="<div class=\"livegrp\" aria-label=\"キャッシュ生存中 / 期限切れ後の損益\">"
      +liveCard("🔥 relay 損益 ― キャッシュ生存中に捨てた分",rs.live,"live","損益 = 節約 − 再書込（生きていたキャッシュを捨てたので、再書込は本当の追加コスト）")
      +liveCard("⌛ relay 損益 ― 期限切れ後",rs.dead,"small","損益 = 節約 − 再書込（キャッシュは既に切れていた）")
      +liveCard("🔥 compaction 損益 ― キャッシュ生存中",cs.live,"small","損益 = 節約 − 再書込")
      +liveCard("⌛ compaction 損益 ― 期限切れ後",cs.dead,"small","損益 = 節約 − 再書込")+"</div>";
  }
  var days=cacheDays(agg,sel);
  if(days.length){
    var a=cacheChartBlock(days,"日別「ドロップ vs 再キャッシュ」",[{key:"dropped",cls:"k-drop",grouped:true},{key:"recache",cls:"k-rc",grouped:true}],
      function(d){return Math.max(d.dropped,d.recache)},
      function(d){return d.date+"  ドロップ "+fmtTok(d.dropped)+" / 再キャッシュ "+fmtTok(d.recache)+"（"+fmtMoney(d.recacheCost)+"）"+(d.events?"  "+d.events+"件":"")},
      "<span><i class=\"k-drop\"></i>ドロップ（relay+compaction）</span><span><i class=\"k-rc\"></i>再キャッシュ書込</span>");
    var b=cacheChartBlock(days,"日別「cache miss の再処理 tokens」",[{key:"missTtl",cls:"k-ttl"},{key:"missModel",cls:"k-mod"},{key:"missOther",cls:"k-oth"}],
      function(d){return d.missTokens},
      function(d){return d.date+"  miss "+d.misses+"件 / "+fmtTok(d.missTokens)+"（TTL "+fmtTok(d.missTtl)+" / モデル "+fmtTok(d.missModel)+" / その他 "+fmtTok(d.missOther)+"）  "+fmtMoney(d.missCost)},
      "<span><i class=\"k-ttl\"></i>TTL切れ</span><span><i class=\"k-mod\"></i>モデル切替</span><span><i class=\"k-oth\"></i>その他</span>");
    h+="<div class=\"spgrid\">"+a+b+cacheNetChartBlock(days,"日別「relay 損益 $」")+"</div>";
  }
  if(hasLive&&evsAll.length){
    h+="<div class=\"livetg\" role=\"group\" aria-label=\"キャッシュ状態で絞り込み\">";
    [["all","すべて",evsAll.length],["live","🔥生存",filterCacheLive(evsAll,"live").length],["dead","⌛期限切れ",filterCacheLive(evsAll,"dead").length]].forEach(function(o){
      h+="<button type=\"button\" class=\"livebtn"+(state.cacheLive===o[0]?" on":"")+"\" data-live=\""+o[0]+"\" aria-pressed=\""+(state.cacheLive===o[0])+"\">"+o[1]+" "+o[2]+"</button>";
    });
    h+="</div>";
  }
  if(!evs.length){
    h+="<p class=\"empty\">この条件の relay / compaction はありません。</p>";
  }else{
    var shown=Math.min(evs.length,state.cacheLimit);
    h+="<div class=\"sptbl\"><table class=\"sp\"><thead><tr><th class=\"l\">日時</th><th class=\"l\">プロジェクト</th><th class=\"l\">種別</th><th class=\"l\" title=\"relay / compaction の時点で前のプロンプトキャッシュがまだ有効だったか\">キャッシュ</th><th>before → after</th><th>ドロップ</th><th>再キャッシュ tokens</th><th>再キャッシュ $</th><th title=\"relay / compaction 後、次の relay / compaction までの実リクエスト数\">後続要求数</th><th title=\"再書込コストを回収するのに必要な要求数（節約 = 後続要求数 × 捨てた tokens × cacheRead単価 が再書込以上になる点）\">損益分岐(要求)</th><th title=\"損益 = 節約 − 再書込。節約 = 後続要求数 × 捨てた tokens × cacheRead単価\">損益 $</th></tr></thead><tbody>";
    for(var i=0;i<shown;i++)h+=cacheEventRow(evs[i]);
    h+="</tbody></table></div>";
    if(evs.length>shown)h+="<button type=\"button\" id=\"cacheMore\" class=\"more cmore\">さらに表示（残り "+(evs.length-shown)+"件）</button>";
  }
  h+="<p class=\"spnote\">cache miss = 直前の接頭辞の50%未満しか cacheRead できなかった要求（再処理 tokens と推定コストは書き直し分）。relay / compaction 後の最初の要求は miss に数えず、再キャッシュとして集計します。before は tokensBefore の推定値、ドロップ = Σ max(0, before − after)。範囲はカレンダー選択とプロジェクト絞り込みに従い、検索語は適用しません。</p>"
    +"<p class=\"spnote\">損益は反事実の概算です（relay しなかった場合、以後の各要求で「捨てた tokens」を余分に cacheRead していたと仮定。品質面や compaction を遅らせる効果は含まない）。節約 = 後続要求数 × 捨てた tokens × cacheRead単価、損益 = 節約 − 再書込。「未回収」は最後の compaction でセッションが進行中または終了したもの。</p>"
    +(hasLive?"<p class=\"spnote\">🔥生存（キャッシュ生存中）= 前のリクエスト（またはウォーマー）から TTL 以内に relay / compaction が発生したもの。TTL は直前の書込が1hなら60分、それ以外は5分。生存中に捨てたキャッシュの再書込は本当の追加コスト、⌛期限切れ後は relay しなくても再キャッシュが必要だった分です。</p>":"");
  body.innerHTML=h;
}
function refresh(){
  var r=compute();
  renderCalendar(r.counts);
  renderList(r.list);
  renderSpend();
  renderCache();
}
function setMonthFromKey(key){var p=key.split("-");state.month={y:+p[0],m:+p[1]-1}}
function shiftMonth(n){var d=new Date(state.month.y,state.month.m+n,1);state.month={y:d.getFullYear(),m:d.getMonth()};refresh()}
function keyAdd(key,n){var p=key.split("-");return dateKey(new Date(+p[0],+p[1]-1,+p[2]+n).getTime())}
function init(data){
  state.entries=prepare(data.entries||[]);
  state.spend=data.spend||[];
  state.cache=data.cache||[];
  state.cacheEvents=data.cacheEvents||[];
  var q=new URLSearchParams(location.search);
  state.projSub=q.get("project")||"";
  buildProjects();
  var newest=state.entries.reduce(function(a,e){return e._ms>a?e._ms:a},0)||Date.now();
  var d=new Date(newest);state.month={y:d.getFullYear(),m:d.getMonth()};
  $("gen").textContent="索引: "+fmtTime(Date.parse(data.generatedAt))+(data.includeSubagents?"（サブエージェント含む）":"")+" ／ 更新は pi-history を再実行";
  refresh();
}
$("q").addEventListener("input",function(){clearTimeout(init.t);var v=this.value;init.t=setTimeout(function(){state.q=v;state.limit=MAX;refresh()},150)});
$("project").addEventListener("change",function(){state.project=this.value;state.limit=MAX;refresh()});
$("sort").addEventListener("change",function(){state.sort=this.value;state.limit=MAX;refresh()});
$("prev").addEventListener("click",function(){shiftMonth(-1)});
$("next").addEventListener("click",function(){shiftMonth(1)});
$("todayBtn").addEventListener("click",function(){var d=new Date();state.month={y:d.getFullYear(),m:d.getMonth()};refresh()});
$("clearDate").addEventListener("click",function(){state.sel=null;state.limit=MAX;refresh()});
$("projChipClear").addEventListener("click",function(){state.projSub="";state.limit=MAX;refresh()});
$("cal").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-key]");if(!b)return;
  state.sel=nextSelection(state.sel,b.getAttribute("data-key"),ev.shiftKey);
  state.limit=MAX;state.focusKey=b.getAttribute("data-key");refresh();
});
$("cal").addEventListener("keydown",function(ev){
  var b=ev.target.closest("[data-key]");if(!b)return;
  var step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[ev.key];
  if(!step)return;
  ev.preventDefault();
  var nk=keyAdd(b.getAttribute("data-key"),step);
  setMonthFromKey(nk);state.focusKey=nk;refresh();
});
$("spend").addEventListener("toggle",function(){renderSpend()});
$("cachep").addEventListener("toggle",function(){renderCache()});
$("cachepBody").addEventListener("click",function(ev){var lb=ev.target.closest(".livebtn");if(lb){state.cacheLive=lb.getAttribute("data-live");renderCache();return}if(ev.target.closest("#cacheMore")){state.cacheLimit+=CACHE_LIMIT;renderCache()}});
$("spendBody").addEventListener("click",function(ev){
  var tg=ev.target.closest("[data-tg]");
  if(tg){var k=tg.getAttribute("data-tg");state.expanded[k]=!state.expanded[k];renderSpend();return}
  var row=ev.target.closest("tr.pj");
  if(row){
    var name=row.getAttribute("data-pj"),s=$("project");
    state.project=name;state.projSub="";state.limit=MAX;
    if(s.value!==name){buildProjects()}
    s.value=name;refresh();
  }
});
$("list").addEventListener("click",function(ev){
  var c=ev.target.closest("[data-copy]");
  if(c){ev.preventDefault();copy(c.getAttribute("data-copy"));return}
  if(ev.target.closest("#more")){state.limit+=MAX;renderList(compute().list)}
});
fetch("/api/index").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(init).catch(function(e){$("list").innerHTML="<p class=\"empty\">索引を読み込めませんでした: "+esc(e.message)+"</p>"});
})();
</script>
</body></html>
